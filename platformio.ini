[common]
lib_deps =
    crankyoldgit/IRremoteESP8266@^2.9.0
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit SSD1306@^2.5.10
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SHT31 Library@^2.2.2
    knolleary/PubSubClient@^2.8

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_deps = ${common.lib_deps}
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-c6-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.38-1
board = esp32-c6-devkitc-1
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; ARDUINO_USB_MODE=1 selects HWCDC (USB-Serial-JTAG) — the inverse of OTG.
    ; CDC_ON_BOOT=1 then routes Arduino `Serial` to the USB-Serial-JTAG device.
    ; Without USB_MODE=1 the core takes a USBSerial (OTG) branch that doesn't exist on C6.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1